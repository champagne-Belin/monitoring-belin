<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycle Gyropalette — O.BELIN</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1a17;
    --paper: #ffffff;
    --line: #e2ddd2;
    --gold: #c9a24b;
    --gold-deep: #a8813f;
    --straw: #f4efe2;
    --mist: #8a8276;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 56px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 26px 26px 22px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 24px 48px -28px rgba(28,26,23,0.18);
  }

  .mark {
    text-align: center;
    padding-bottom: 18px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .mark .maison-top {
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .mark .maison-bottom {
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin-top: 4px;
  }
  .mark .subtitle {
    font-size: 0.64rem;
    color: var(--mist);
    margin-top: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .layout { display: flex; gap: 22px; align-items: center; }

  .gauge-wrap { display: flex; flex-direction: column; align-items: center; width: 64px; }
  .gauge-top-label, .gauge-bottom-label { font-size: 0.6rem; color: var(--mist); }
  .gauge-top-label { margin-bottom: 6px; }
  .gauge-bottom-label { margin-top: 6px; }

  .tube {
    position: relative;
    width: 34px;
    height: 190px;
    border: 1.5px solid var(--line);
    border-radius: 17px;
    overflow: hidden;
    background: var(--straw);
  }
  .tick { position: absolute; left: -1px; width: 6px; height: 1px; background: var(--line); }
  .fill {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 0%;
    background: linear-gradient(180deg, #d8b869, var(--gold-deep));
    border-radius: 0 0 16px 16px;
    transition: height 0.8s ease;
  }
  .bubble {

    bottom: -6px;

    background-repeat: no-repeat;
    opacity: 0.5;
    animation: rise 3.4s linear infinite;
  }
  @keyframes rise { to { transform: translateY(-85px); opacity: 0; } }
  .marker {
    position: absolute; left: -6px; right: -6px;
    height: 2px; background: var(--ink); bottom: 0%;
    transition: bottom 0.8s ease;
  }
  .marker::after {
    content: ""; position: absolute; right: -9px; top: -4px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--ink);
  }

  .hero { flex: 1; }
  .hero-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--mist); }
  .hero-value {
    font-family: 'Fraunces', serif;
    font-size: 2.6rem;
    font-weight: 600;
    color: var(--gold-deep);
    line-height: 1.05;
    margin-top: 4px;
  }
  .hero-unit { font-size: 0.7rem; color: var(--mist); margin-top: 2px; }

  .secondary {
    display: flex; gap: 18px;
    margin-top: 20px; padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .stat-label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--mist); }
  .stat-value { font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 600; margin-top: 2px; }

  .status-line { text-align: center; font-size: 0.66rem; color: var(--mist); margin-top: 22px; }
  .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #6fae7a; margin-right: 6px; box-shadow: 0 0 5px #6fae7a;
    animation: pulse 2s ease-in-out infinite;
  }
  .dot.demo { background: var(--gold-deep); box-shadow: 0 0 5px var(--gold-deep); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .badge { display: block; text-align: center; margin-top: 10px; font-size: 0.58rem; color: var(--mist); }

  /* Bouton retour — même style que les boutons quicklinks de l'index */
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:600;
    color:#0071e3;
    background:rgba(0,113,227,0.08);
    border:1px solid rgba(0,113,227,0.15);
    padding:8px 16px;
    border-radius:980px;
    text-decoration:none;
    margin-bottom:18px;
    transition:background 0.15s ease, transform 0.15s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing:-0.01em;
  }
  .back-link:active{
    background:rgba(0,113,227,0.16);
    transform:scale(0.97);
  }

  /* Repères des mouvements réels détectés (accéléromètre) sur la jauge */
  .move-tick {
    position: absolute;
    left: -3px;
    width: 40px;
    height: 2px;
    background: var(--ink);
    opacity: 0.28;
  }

  /* Bloc "prochain mouvement" */
  .next-move {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .next-move .lbl { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--mist); }
  .next-move .val { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1rem; margin-top: 2px; }

  /* Bandeau d'alerte, actif dans la marge de préavis avant un mouvement */
  .alert-banner {
    display: none;
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 6px;
    background: #fdeee6;
    border: 1px solid #e8a878;
    color: #a8562f;
    font-size: 0.72rem;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.02em;
    animation: alertPulse 1.1s ease-in-out infinite;
  }
  .alert-banner.active { display: block; }
  @keyframes alertPulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← Retour au monitoring</a>

<div class="card">

  <div class="mark">
    <div class="maison-top">Champagne</div>
    <div class="maison-bottom">O.BELIN</div>
    <div class="subtitle">Cycle Gyropalette</div>
  </div>

  <div class="layout">
    <div class="gauge-wrap">
      <div class="gauge-top-label">Fin</div>
      <div class="tube" id="tube">
        <div class="tick" style="bottom:0%"></div>
        <div class="tick" style="bottom:25%"></div>
        <div class="tick" style="bottom:50%"></div>
        <div class="tick" style="bottom:75%"></div>
        <div class="tick" style="bottom:100%"></div>
        <div class="marker" id="marker"></div>
        <div class="fill" id="fill"></div>
        <div id="move-ticks"></div>
      </div>
      <div class="gauge-bottom-label">Début</div>
    </div>

    <div class="hero">
      <div class="hero-label">Temps restant</div>
      <div class="hero-value" id="val-remaining">—</div>
      <div class="hero-unit">avant fin de cycle</div>
      <div class="hero-unit" id="val-pct" style="color: var(--gold-deep); font-weight:600; margin-top:6px;">—</div>
    </div>
  </div>

  <div class="secondary">
    <div>
      <div class="stat-label">Début remuage</div>
      <div class="stat-value" id="val-start">—</div>
    </div>
    <div>
      <div class="stat-label">Fin prévue</div>
      <div class="stat-value" id="val-end">—</div>
    </div>
    <div>
      <div class="stat-label">Écoulé</div>
      <div class="stat-value" id="val-elapsed">—</div>
    </div>
  </div>

  <div class="next-move" id="next-move" style="display:none;">
    <div>
      <div class="lbl">Prochain mouvement estimé</div>
      <div class="val" id="val-next-move">—</div>
    </div>
  </div>

  <div class="alert-banner" id="alert-banner">🔔 Mouvement de cage imminent</div>

  <div class="status-line"><span class="dot" id="status-dot"></span><span id="status-text">Chargement…</span></div>
  <span class="badge" id="badge" style="display:none;">Mode démonstration — onglet Sheet pas encore branché</span>
</div>

<script>
/* ============================================================
   CONFIGURATION
   ============================================================ */

// URL du déploiement Web App du script Apps Script "Gyropalette connectée"
// (celle que le firmware ESP32 appelle déjà pour gyro_log / gyro_update_state)
const GYRO_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyOXmQnGRqAmgJY5KZiub6csKPpGR7yNMNoW5j7nHWh7BbP5wdZG_k6PShB-nQTlFUwTA/exec";

// Même code d'accès que le reste du site (cookie belin_code)
const ACCESS_CODE = getCookie("belin_code") || "";

/* ============================================================ */

const joursMois = ["jan.","fév.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

function getCookie(name){
  const match = document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
  return match ? decodeURIComponent(match[2]) : null;
}

function fmtDateHeure(d) {
  const j = d.getDate();
  const m = joursMois[d.getMonth()];
  const h = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");
  return `${j} ${m}, ${h}h${min}`;
}
function fmtDuration(hours) {
  if (hours < 0) hours = 0;
  const d = Math.floor(hours / 24);
  const h = Math.round(hours % 24);
  return d > 0 ? `${d}j ${h}h` : `${h}h`;
}

// Progression calculée sur le TEMPS écoulé (t0 + duree_cycle_h), pas sur l'angle :
// le remuage avance par mouvements discrets ("coups de cage"), l'angle ne varie
// donc pas proportionnellement au temps.
function render(startTime, dureeCycleH, isDemo, dernierAngle, mouvements, prochainMouvement, alerteA) {
  const now = new Date();
  const endTime = new Date(startTime.getTime() + dureeCycleH * 3600000);
  const elapsedH = (now - startTime) / 3600000;
  const remainingH = Math.max(dureeCycleH - elapsedH, 0);
  const fillPct = Math.min(Math.max(Math.round((elapsedH / dureeCycleH) * 100), 0), 100);

  document.getElementById("fill").style.height = fillPct + "%";
  document.getElementById("marker").style.bottom = fillPct + "%";
  document.getElementById("val-remaining").textContent = fmtDuration(remainingH);
  document.getElementById("val-pct").textContent = fillPct + "% du cycle effectué";
  document.getElementById("val-start").textContent = fmtDateHeure(startTime);
  document.getElementById("val-end").textContent = fmtDateHeure(endTime);
  document.getElementById("val-elapsed").textContent = fmtDuration(Math.max(elapsedH, 0));

  // Repères des mouvements réels détectés, positionnés sur la même échelle que la jauge
  const ticksHolder = document.getElementById("move-ticks");
  ticksHolder.innerHTML = "";
  if (mouvements && mouvements.length) {
    mouvements.forEach(m => {
      const pct = Math.min(Math.max((m.temps_ecoule_h / dureeCycleH) * 100, 0), 100);
      const t = document.createElement("div");
      t.className = "move-tick";
      t.style.bottom = pct + "%";
      ticksHolder.appendChild(t);
    });
  }

  // Prochain mouvement estimé (dernier mouvement réel + intervalle de phase, sans dérive)
  const nextMoveEl = document.getElementById("next-move");
  const banner = document.getElementById("alert-banner");
  if (prochainMouvement) {
    nextMoveEl.style.display = "flex";
    const diffMin = Math.round((prochainMouvement - now) / 60000);
    document.getElementById("val-next-move").textContent =
      diffMin > 0 ? `dans ${diffMin} min (${fmtDateHeure(prochainMouvement)})` : "imminent";
    const dansLaMarge = alerteA && now >= alerteA && now < prochainMouvement;
    banner.classList.toggle("active", !!dansLaMarge);
  } else {
    nextMoveEl.style.display = "none";
    banner.classList.remove("active");
  }

  const dot = document.getElementById("status-dot");
  const badge = document.getElementById("badge");
  if (isDemo) {
    dot.classList.add("demo");
    document.getElementById("status-text").textContent = "Données d'exemple";
    badge.style.display = "block";
  } else {
    dot.classList.remove("demo");
    const angleTxt = (dernierAngle != null) ? ` · dernier angle connu ${dernierAngle}°` : "";
    document.getElementById("status-text").textContent = "Connecté" + angleTxt;
    badge.style.display = "none";
  }
}

async function refresh() {
  if (!GYRO_WEBAPP_URL || GYRO_WEBAPP_URL.startsWith("COLLEZ_ICI")) {
    const demoStart = new Date(Date.now() - 40 * 3600000);
    const demoMouvements = [10, 22, 34, 46, 58, 70].map(h => ({ temps_ecoule_h: h }));
    const demoProchain = new Date(Date.now() + 8 * 60000);
    const demoAlerte = new Date(Date.now() - 5000);
    render(demoStart, 96, true, 52, demoMouvements, demoProchain, demoAlerte);
    return;
  }
  try {
    const url = `${GYRO_WEBAPP_URL}?type=gyro_status&code=${encodeURIComponent(ACCESS_CODE)}`;
    const res = await fetch(url, { cache: "no-store" });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "accès refusé");
    if (!json.cycle_actif) {
      document.getElementById("status-text").textContent = "Aucun cycle en cours";
      document.getElementById("badge").style.display = "none";
      document.getElementById("next-move").style.display = "none";
      document.getElementById("alert-banner").classList.remove("active");
      return;
    }
    const prochain = json.prochain_mouvement_prevu ? new Date(json.prochain_mouvement_prevu) : null;
    const alerteA = json.alerte_a ? new Date(json.alerte_a) : null;
    render(
      new Date(json.t0),
      parseFloat(json.duree_cycle_h),
      false,
      json.dernier_angle,
      json.mouvements || [],
      prochain,
      alerteA
    );
  } catch (e) {
    document.getElementById("status-text").textContent = "Erreur : " + e.message;
  }
}


const tube = document.getElementById("tube");
for (let i = 0; i < 6; i++) {
  const b = document.createElement("div");
  const size = 3 + Math.random() * 3;
  b.className = "bubble";
  b.style.width = size + "px";
  b.style.height = size + "px";
  b.style.left = (8 + Math.random() * 18) + "px";
  b.style.animationDelay = (Math.random() * 3.4) + "s";
  tube.appendChild(b);
}

refresh();
setInterval(refresh, 10000); // 10 sec, pour ne pas manquer la fenêtre d'alerte pré-mouvement
</script>
